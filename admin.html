<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin | Praiseneh888</title><link rel="stylesheet" href="/styles.css"></head>
<body class="admin-page"><header class="site-header"><a class="brand" href="/"><span class="brand-mark">✦</span><span>Praiseneh888<small>ADMIN DASHBOARD</small></span></a><a class="text-link" href="/">← View catalogue</a></header>
<main class="admin-wrap"><section id="loginPanel" class="admin-login"><p class="eyebrow">PRIVATE ACCESS</p><h1>Admin sign in</h1><p class="muted">Sign in using an account created in Supabase Authentication.</p><form id="loginForm"><label>Email<input type="email" id="email" required autocomplete="username"></label><label>Password<input type="password" id="password" required autocomplete="current-password"></label><button class="gold-button" type="submit">Sign in</button><p id="loginMessage" class="form-message"></p></form></section>
<section id="dashboard" hidden><div class="admin-title"><div><p class="eyebrow">COLLECTION MANAGEMENT</p><h1>Your catalogue</h1></div><button class="outline-button" id="signOut">Sign out</button></div>
<div class="admin-columns"><form id="amuletForm" class="editor"><h2 id="formHeading">Add a piece</h2><input type="hidden" id="itemId"><label>Amulet / item name<input id="itemName" required maxlength="140"></label><label>Master / maker<input id="master" maxlength="140"></label><label>Category<input id="category" maxlength="80" placeholder="e.g. Khun Paen, Lersi, Takrut"></label><label>Description<textarea id="description" rows="5"></textarea></label><div class="form-row"><label>Price display<select id="priceMode"><option value="price">Show price (SGD)</option><option value="pm">PM FOR PRICE</option></select></label><label>Price (SGD)<input id="price" type="number" min="0" step="0.01" placeholder="e.g. 188"></label></div><label>Availability<select id="status"><option value="available">Available</option><option value="reserved">Reserved</option><option value="sold">Past collection</option></select></label><label>Photos<input id="photos" type="file" accept="image/*" multiple></label><p class="muted tiny">You can select multiple photos. New uploads are added to this listing.</p><div class="form-row"><button class="gold-button" type="submit" id="saveButton">Save piece</button><button class="outline-button" type="button" id="clearForm">Clear</button></div><p id="editorMessage" class="form-message"></p></form>
<div class="admin-list"><div class="list-heading"><h2>Existing pieces</h2><span id="adminCount" class="muted"></span></div><div id="adminItems"></div></div></div></section></main><script type="module" src="/admin.js"></script></body></html>
